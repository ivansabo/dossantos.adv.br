  <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="200" fill="#1c2b4a"></rect>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 color:#b6923c; margin-bottom:18px;\">SOBRE O ESCRITÓRIO<\u002Fdiv>\n      <h2 style=\"font-family:'Cormorant Garamond',serif; font-size:44px; font-weight:600; line-height:1.15; margin:0 0 26px; color:#1c2b4a;\">Tradição, ética e excelência a serviço de quem confia em nós.<\u002Fh2>\n      <p style=\"font-size:16.5px; line-height:1.85; color:#3a4665; margin:0 0 20px;\">{{ aboutText1 }}<\u002Fp>\n      <p style=\"font-size:16.5px; line-height:1.85; color:#3a4665; margin:0;\">{{ aboutText2 }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- AREAS -->\n  <div id=\"areas\" style=\"background:#1c2b4a; padding:120px 6%;\">\n    <div style=\"max-width:1280px; margin:0 auto;\">\n      <div style=\"text-align:center; margin-bottom:70px;\">\n        <div style=\"font-size:12px; letter-spacing:4px; color:#b6923c; margin-bottom:18px;\">ÁREAS DE ATUAÇÃO<\u002Fdiv>\n        <h2 style=\"font-family:'Cormorant Garamond',serif; font-size:42px; font-weight:600; color:#faf6ef; margin:0;\">Atendimento completo e especializado<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:#faf6ef22;\">\n        <sc-for list=\"{{ areas }}\" as=\"area\" hint-placeholder-count=\"8\">\n          <div style=\"background:#1c2b4a; padding:40px 30px;\">\n            <div style=\"width:36px; height:36px; border:1px solid #b6923c; border-radius:50%; margin-bottom:22px;\"><\u002Fdiv>\n            <h3 style=\"font-family:'Cormorant Garamond',serif; font-size:22px; font-weight:600; color:#faf6ef; margin:0 0 12px;\">{{ area.name }}<\u002Fh3>\n            <p style=\"font-size:14px; line-height:1.7; color:#c3cadd; margin:0;\">{{ area.desc }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- EQUIPE -->\n  <div id=\"equipe\" style=\"padding:130px 6%; max-width:1280px; margin:0 auto;\">\n    <div style=\"text-align:center; margin-bottom:70px;\">\n      <div style=\"font-size:12px; letter-spacing:4px; color:#b6923c; margin-bottom:18px;\">NOSSA EQUIPE<\u002Fdiv>\n      <h2 style=\"font-family:'Cormorant Garamond',serif; font-size:42px; font-weight:600; color:#1c2b4a; margin:0;\">Quem conduz o seu caso<\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:grid; grid-template-columns:280px 1fr; gap:60px; align-items:start; max-width:900px; margin:0 auto;\">\n      <div style=\"text-align:center;\">\n        <image-slot id=\"dirceu-foto\" src=\"02206f96-18fd-44d2-8c7e-073930c96415\" placeholder=\"foto do advogado\" shape=\"rect\" style=\"width:100%; aspect-ratio:3/4; border-radius:2px; margin-bottom:20px;\"><\u002Fimage-slot>\n        <h3 style=\"font-family:'Cormorant Garamond',serif; font-size:26px; font-weight:600; margin:0 0 4px; color:#1c2b4a;\">Dirceu dos Santos<\u002Fh3>\n        <div style=\"font-size:13px; letter-spacing:0.5px; color:#b6923c; line-height:1.5;\">Desembargador Aposentado<br>Advogado · OAB/MT 2794<\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:15.5px; line-height:1.85; color:#3a4665; margin:0;\">{{ dirceuBio }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- METODOLOGIA -->\n  <div id=\"metodologia\" style=\"background:#1c2b4a; padding:120px 6%;\">\n    <div style=\"max-width:1280px; margin:0 auto;\">\n      <div style=\"text-align:center; margin-bottom:70px;\">\n        <div style=\"font-size:12px; letter-spacing:4px; color:#b6923c; margin-bottom:18px;\">METODOLOGIA DE TRABALHO<\u002Fdiv>\n        <h2 style=\"font-family:'Cormorant Garamond',serif; font-size:42px; font-weight:600; color:#faf6ef; margin:0;\">Como conduzimos o seu caso<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:40px;\">\n        <sc-for list=\"{{ methodology }}\" as=\"step\" hint-placeholder-count=\"4\">\n          <div>\n            <div style=\"font-family:'Cormorant Garamond',serif; font-size:44px; font-weight:600; color:#b6923c55; margin-bottom:14px;\">{{ step.step }}<\u002Fdiv>\n     <h2 style=\"font-family:'Cormorant Garamond',serif; font-size:42px; font-weight:600; color:#1c2b4a; margin:0;\">Quem confiou, recomenda<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:36px;\">\n        <sc-for list=\"{{ testimonials }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div style=\"background:#faf6ef; padding:36px 32px; border-radius:2px; border-top:2px solid #b6923c;\">\n            <div style=\"font-family:'Cormorant Garamond',serif; font-size:50px; color:#b6923c88; line-height:0.5; margin-bottom:14px;\">\"<\u002Fdiv>\n            <p style=\"font-size:15px; line-height:1.75; color:#2f3a58; margin:0 0 22px; font-style:italic;\">{{ t.quote }}<\u002Fp>\n            <div style=\"font-size:13.5px; font-weight:500; color:#1c2b4a;\">{{ t.author }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- CONTATO -->\n  <div id=\"contato\" style=\"padding:130px 6%; max-width:1280px; margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:80px;\">\n    <div>\n      <div style=\"font-size:12px; letter-spacing:4px; color:#b6923c; margin-bottom:18px;\">CONTATO<\u002Fdiv>\n      <h2 style=\"font-family:'Cormorant Garamond',serif; font-size:42px; font-weight:600; color:#1c2b4a; margin:0 0 26px;\">Vamos conversar sobre o seu caso<\u002Fh2>\n      <p style=\"font-size:16px; line-height:1.8; color:#3a4665; margin:0 0 40px;\">Atendimento sigiloso e personalizado. Envie sua mensagem ou fale diretamente pelo WhatsApp.<\u002Fp>\n      <div style=\"display:flex; flex-direction:column; gap:22px;\">\n        <div style=\"display:flex; gap:16px; align-items:flex-start;\">\n          <div style=\"width:38px; height:38px; border-radius:50%; border:1px solid #b6923c; flex-shrink:0;\"><\u002Fdiv>\n          <div>\n            <div style=\"font-size:12px; letter-spacing:1px; color:#b6923c;\">TELEFONE / WHATSAPP<\u002Fdiv>\n            <div style=\"font-size:17px; color:#1c2b4a;\">{{ phone }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:16px; align-items:flex-start;\">\n          <div style=\"width:38px; height:38px; border-radius:50%; border:1px solid #b6923c; flex-shrink:0;\"><\u002Fdiv>\n          <div>\n            <div style=\"font-size:12px; letter-spacing:1px; color:#b6923c;\">E-MAIL<\u002Fdiv>\n            <div style=\"font-size:17px; color:#1c2b4a;\">{{ email }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:16px; align-items:flex-start;\">\n          <div style=\"width:38px; height:38px; border-radius:50%; border:1px solid #b6923c; flex-shrink:0;\"><\u002Fdiv>\n          <div>\n            <div style=\"font-size:12px; letter-spacing:1px; color:#b6923c;\">ENDEREÇO<\u002Fdiv>\n            <div style=\"font-size:17px; color:#1c2b4a;\">{{ address }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#f0e9dc; padding:44px; border-radius:2px;\">\n      <div style=\"display:flex; flex-direction:column; gap:20px;\">\n        <input placeholder=\"Nome completo\" style=\"padding:16px; border:1px solid #1c2b4a33; background:#faf6ef; font-family:'Jost',sans-serif; font-size:14px; border-radius:2px; color:#1c2b4a;\">\n        <input placeholder=\"Telefone / WhatsApp\" style=\"padding:16px; border:1px solid #1c2b4a33; background:#faf6ef; font-family:'Jost',sans-serif; font-size:14px; border-radius:2px; color:#1c2b4a;\">\n        <input placeholder=\"E-mail\" style=\"padding:16px; border:1px solid #1c2b4a33; background:#faf6ef; font-family:'Jost',sans-serif; font-size:14px; border-radius:2px; color:#1c2b4a;\">\n        <textarea placeholder=\"Descreva brevemente seu caso\" rows=\"4\" style=\"padding:16px; border:1px solid #1c2b4a33; background:#faf6ef; font-family:'Jost',sans-serif; font-size:14px; border-radius:2px; resize:vertical; color:#1c2b4a;\"><\u002Ftextarea>\n        <a href=\"{{ waLink }}\" target=\"_blank\" style=\"text-align:center; background:#1c2b4a; color:#faf6ef; padding:17px; font-size:14px; letter-spacing:1.5px; border-radius:2px;\" style-hover=\"background:#b6923c; color:#1c2b4a;\">ENVIAR MENSAGEM<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FOOTER -->\n  <div style=\"background:#16223e; padding:60px 6% 34px;\">\n    <div style=\"max-width:1280px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:24px; border-bottom:1px solid #faf6ef22; padding-bottom:36px; margin-bottom:24px;\">\n      <div style=\"display:flex; align-items:baseline; gap:8px;\">\n        <span style=\"font-family:'Cormorant Garamond',serif; font-weight:700; font-size:22px; letter-spacing:2px; color:#faf6ef;\">DOS SANTOS<\u002Fspan>\n        <span style=\"font-size:10px; letter-spacing:3px; color:#b6923c;\">ADVOCACIA<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:28px; font-size:13px; color:#c3cadd;\">\n        <a href=\"#sobre\" style-hover=\"color:#b6923c;\">Sobre<\u002Fa>\n        <a href=\"#areas\" style-hover=\"color:#b6923c;\">Áreas<\u002Fa>\n        <a href=\"#equipe\" style-hover=\"color:#b6923c;\">Equipe<\u002Fa>\n        <a href=\"#contato\" style-hover=\"color:#b6923c;\">Contato<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1280px; margin:0 auto; font-size:12.5px; color:#8a94b8; text-align:center;\">© {{ year }} Dos Santos Advocacia. Todos os direitos reservados. {{ address }}<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1440}, &quot;phone&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;(65) 9 9981-4046&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Contato&quot;}, &quot;email&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;contato@dossantos.adv.br&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Contato&quot;}, &quot;address&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Cuiabá / MT, Brasil&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Contato&quot;}, &quot;tagline&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Garantindo seus direitos com tradição e excelência.&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Textos&quot;}, &quot;waMessage&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Olá! Gostaria de agendar uma consulta com o escritório Dos Santos Advocacia.&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Contato&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const phone = this.props.phone ?? \"(65) 9 9981-4046\";\n    const digits = phone.replace(/\\D/g, \"\");\n    const waDigits = digits.length <= 11 ? \"55\" + digits : digits;\n    const waMessage = this.props.waMessage ?? \"Olá! Gostaria de agendar uma consulta com o escritório Dos Santos Advocacia.\";\n    return {\n      phone,\n      waLink: \"https://wa.me/\" + waDigits + \"?text=\" + encodeURIComponent(waMessage),\n      email: this.props.email ?? \"contato@dossantos.adv.br\",\n      address: this.props.address ?? \"Cuiabá / MT, Brasil\",\n      tagline: this.props.tagline ?? \"Garantindo seus direitos com tradição e excelência.\",\n      aboutText1: this.props.aboutText1 ?? \"O escritório Dos Santos Advocacia nasceu do compromisso com a justiça e o respeito ao cliente, unindo rigor técnico a um atendimento próximo e humano em Cuiabá e região.\",\n      aboutText2: this.props.aboutText2 ?? \"Nossa equipe multidisciplinar acompanha cada caso com dedicação integral, buscando sempre a melhor solução jurídica dentro dos princípios da ética e da transparência.\",\n      year: new Date().getFullYear(),\n      areas: this.props.areas ?? this.defaultAreas(),\n      dirceuBio: this.props.dirceuBio ?? this.defaultDirceuBio(),\n      testimonials: this.props.testimonials ?? this.defaultTestimonials(),\n      articles: this.props.articles ?? this.defaultArticles(),\n      methodology: this.defaultMethodology(),\n    };\n  }\n  defaultAreas() {\n    return [\n      { name: \"Direito Civil\", desc: \"Contratos, responsabilidade civil e questões patrimoniais.\" },\n      { name: \"Direito de Família e Sucessões\", desc: \"Divórcio, guarda, pensão alimentícia, inventário e testamento.\" },\n      { name: \"Direito Trabalhista\", desc: \"Defesa de empregados e empresas em questões trabalhistas.\" },\n      { name: \"Direito Empresarial\", desc: \"Constituição de empresas, contratos e consultoria societária.\" },\n      { name: \"Direito Criminal\", desc: \"Defesa técnica em todas as fases do processo penal.\" },\n      { name: \"Direito Tributário\", desc: \"Planejamento tributário e defesa em autuações fiscais.\" },\n      { name: \"Direito Previdenciário\", desc: \"Aposentadorias, benefícios e revisões junto ao INSS.\" },\n      { name: \"Direito do Consumidor\", desc: \"Defesa dos direitos do consumidor em relações de consumo.\" },\n      { name: \"Direito Eleitoral\", desc: \"Consultoria e defesa em processos eleitorais, campanhas e prestação de contas.\" },\n    ];\n  }\n  defaultMethodology() {\n    return [\n      { step: \"01\", name: \"Análise\", desc: \"Estudo detalhado do caso e do cenário jurídico envolvido.\" },\n      { step: \"02\", name: \"Estratégia\", desc: \"Definição do caminho mais seguro e eficaz para o cliente.\" },\n      { step: \"03\", name: \"Execução\", desc: \"Condução técnica do caso com transparência em cada etapa.\" },\n      { step: \"04\", name: \"Acompanhamento\", desc: \"Retorno constante sobre o andamento e próximos passos.\" },\n    ];\n  }\n  defaultDirceuBio() {\n    return \"Dirceu dos Santos, filho de Ana Maria dos Santos e de Pedro Alexandre dos Santos, nasceu em 04 de julho de 1959, no município de Ortigueira, estado do Paraná. Formou-se em Direito pela Universidade Estadual de Londrina - UEL – no ano de 1983, local em que exerceu também a função de auxiliar administrativo. No ano em que se graduou, mudou-se para o município mato-grossense de Diamantino para exercer a advocacia, tendo sido conselheiro da Ordem dos Advogados nos anos de 1989 e 1990. Deixou a advocacia para ingressar na carreira de magistrado estadual pelo Tribunal de Justiça de Mato Grosso (TJMT), tendo sido nomeado em 23 de abril de 1990. Jurisdicionou nas comarcas de Água Boa, Nova Xavantina, Alto Araguaia, Rosário Oeste, Nobres, Juína, Diamantino e Cuiabá. Recebeu Moção de Aplausos por esta casa pela lisura e parcimônia com que conduziu os trabalhos eleitorais no ano de 1992, bem como diversos votos de elogio e de louvor. Promovido por merecimento para o cargo de Desembargador, ascendeu em agosto de 2011, presidindo a Comissão Estadual Judiciária de Adoção (CEJA) e o Conselho de Supervisão dos Juizados Especiais. Aposentou-se como Desembargador do Tribunal de Justiça de Mato Grosso, retornando à advocacia com o propósito de colocar sua vasta experiência na magistratura a serviço dos jurisdicionados mato-grossenses.\";\n  }\n  defaultArticles() {\n    return [\n      { tag: \"Doutrina\", title: \"Guarda compartilhada: o que diz a lei e como funciona na prática\", desc: \"Panorama sobre os critérios adotados pelos tribunais na definição da guarda dos filhos.\" },\n      { tag: \"Jurisprudência\", title: \"STJ e a revisão de cláusulas abusivas em contratos de consumo\", desc: \"Decisões recentes que ampliam a proteção do consumidor em contratos de adesão.\" },\n      { tag: \"Doutrina\", title: \"Prestação de contas eleitorais: prazos e riscos para candidatos\", desc: \"Pontos de atenção para evitar a rejeição de contas e possíveis inelegibilidades.\" },\n    ];\n  }\n  defaultTestimonials() {\n    return [\n      { quote: \"Profissionalismo e clareza do início ao fim do processo. Recomendo sem hesitar.\", author: \"R. Almeida, cliente\" },\n      { quote: \"Fui muito bem orientado durante todo o inventário. Equipe atenciosa e competente.\", author: \"C. Ferreira, cliente\" },\n      { quote: \"Resolveram minha questão trabalhista com agilidade e total transparência.\", author: \"L. Souza, cliente\" },\n    ];\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
